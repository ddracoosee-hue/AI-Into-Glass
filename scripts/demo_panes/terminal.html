<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>terminal</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0c0c0c; color: #d9d9d9; overflow: hidden; }
  body { display: grid; grid-template-rows: 40px 1fr; font: 19px/1.45 "Cascadia Mono", Consolas, monospace; }
  header { display: flex; align-items: center; gap: 10px; padding: 0 16px; background: #1b1b1b; border-bottom: 1px solid #2b2b2b;
    font: 15px "Segoe UI", system-ui, sans-serif; color: #b8b8b8; }
  header i { width: 11px; height: 11px; border-radius: 50%; background: #3a3a3a; display: inline-block; }
  header b { font-weight: 600; color: #e8e8e8; margin-left: 6px; }
  main { padding: 14px 18px; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; }
  p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .user { color: #9fd3ff; }
  .tool { color: #e8e8e8; }
  .tool::first-letter { color: #4dff88; }
  .result { color: #9a9a9a; }
  .text { color: #e8e8e8; }
  .ask { color: #0c0c0c; background: #ffd166; padding: 2px 6px; margin: 4px 0; }
  .bad { color: #ff7b7b; }
  .good { color: #4dff88; }
  .dim { color: #6f6f6f; }
</style>
</head>
<body>
<header><i></i><i></i><i></i><b id="title"></b></header>
<main id="lines"></main>
<script>
  const title = document.getElementById('title')
  const box = document.getElementById('lines')
  let last = ''
  async function tick() {
    try {
      const s = await (await fetch('/state.json', { cache: 'no-store' })).json()
      const html = s.lines.map(l => `<p class="${l.k}">${l.t.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c])}</p>`).join('')
      if (html !== last || title.textContent !== s.title) {
        title.textContent = s.title
        box.innerHTML = html
        last = html
      }
    } catch {}
    setTimeout(tick, 120)
  }
  tick()
</script>
</body>
</html>
