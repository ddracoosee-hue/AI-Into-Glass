name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Windows)
    runs-on: windows-latest
    steps:
      # Byte-exact checkouts: the to-do and scrubbing tests hash file contents.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - name: Relay
        run: python -m unittest discover -s relay
      - name: Hook
        run: python -m unittest discover -s hook
      - name: Scripts
        run: python -m unittest discover -s scripts
      - name: Plugin
        working-directory: plugin
        run: |
          npm ci --no-audit --no-fund
          npm test
          npx tsc --noEmit
          npx vite build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: '0.16.9'
          args: check
      - uses: astral-sh/ruff-action@v3
        with:
          version: '0.16.9'
          args: format --check
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npx --yes prettier@3.8.1 --check .
